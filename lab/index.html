<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="自己做来玩的东西。">
<title>Lab · patrick</title>
<style>
*{box-sizing:border-box}
:root,[data-theme="dark"]{
  --bg:#0a0c10;--text:#ccd2da;--text-muted:#7d8794;--text-faint:#2b313a;
  --accent:#6aa2d8;--border:#191d24;--heading:#e9edf2;--rule:#1e232b;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Figtree',-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5f8;--text:#26313d;--text-muted:#5d6b7a;--text-faint:#c2cad4;
  --accent:#2d6496;--border:#dfe4ea;--heading:#16202b;--rule:#e3e8ee;
}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 28px}

/* top bar */
.bar{border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px)}
.bar-in{max-width:720px;margin:0 auto;padding:0 28px;height:52px;display:flex;align-items:center;gap:20px}
.brand{font-family:var(--mono);font-size:.82rem;font-weight:600;letter-spacing:.01em;
  text-decoration:none;color:var(--heading)}
.nav{display:flex;gap:16px;margin-left:auto;align-items:center}
.nav a{font-family:var(--mono);font-size:.76rem;color:var(--text-muted);text-decoration:none;transition:color .15s}
.nav a:hover,.nav a.on{color:var(--accent)}
.theme-toggle{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .icon-sun{display:block}[data-theme="dark"] .icon-moon{display:none}
[data-theme="light"] .icon-sun{display:none}[data-theme="light"] .icon-moon{display:block}

/* index */
.page-title{font-size:2.35rem;line-height:1.15;letter-spacing:-.03em;color:var(--heading);
  margin:72px 0 0;font-family:var(--mono);font-weight:700}
.tabs{display:flex;gap:18px;margin:26px 0 0;border-bottom:1px solid var(--border);padding-bottom:12px}
.tabs button{background:none;border:none;cursor:pointer;padding:0;font-family:var(--mono);
  font-size:.78rem;color:var(--text-muted);transition:color .15s}
.tabs button.on{color:var(--accent)}
.tabs button:hover{color:var(--heading)}

.lede{font-size:1rem;line-height:1.9;color:var(--text-muted);margin:14px 0 34px;max-width:520px}
.posts{list-style:none;margin:0;padding:0 0 80px}
.posts li{border-bottom:1px solid var(--rule)}
.posts a{display:block;text-decoration:none;padding:30px 0 26px}
.posts h2{font-size:1.34rem;line-height:1.45;font-weight:700;color:var(--heading);
  margin:0 0 10px;letter-spacing:-.01em;transition:color .15s}
.posts a:hover h2{color:var(--accent)}
.posts .desc{font-size:1rem;line-height:1.75;color:var(--text-muted);margin:0 0 12px}
.posts time{font-family:var(--mono);font-size:.72rem;color:var(--text-muted);opacity:.72;letter-spacing:.02em}
.posts .empty{padding:40px 0;color:var(--text-muted);font-size:.95rem}

/* article */
.article{padding:64px 0 40px}
.article h1{font-size:2.1rem;line-height:1.3;letter-spacing:-.02em;color:var(--heading);
  margin:0 0 18px;font-weight:700}
.article .meta{font-family:var(--mono);font-size:.74rem;color:var(--text-muted);
  line-height:2;padding-bottom:26px;border-bottom:1px solid var(--border);margin-bottom:34px}
.article .meta a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.source{margin:0 0 34px;padding:14px 16px;border-left:2px solid var(--accent);
  background:color-mix(in srgb,var(--text) 4%,transparent);font-family:var(--mono);font-size:.76rem;line-height:1.9}
.src-label{color:var(--text-muted);margin-right:8px}
.src-url{color:var(--accent);text-decoration:none;word-break:break-all;
  border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.src-url:hover{border-bottom-color:var(--accent)}

.body{font-size:1.125rem;line-height:1.95;color:var(--text)}
.body p{margin:0 0 1.35em}
.body h2{font-size:1.55rem;line-height:1.4;color:var(--heading);margin:2.2em 0 .7em;font-weight:700;letter-spacing:-.01em}
.body h3{font-size:1.22rem;line-height:1.5;color:var(--heading);margin:1.9em 0 .6em;font-weight:600}
.body h4{font-size:1.05rem;color:var(--heading);margin:1.6em 0 .5em}
.body ul,.body ol{margin:0 0 1.35em;padding-left:1.4em}
.body li{margin:.4em 0}
.body blockquote{margin:1.6em 0;padding:2px 0 2px 20px;border-left:2px solid var(--accent);
  color:var(--text-muted);font-style:normal}
.body blockquote p{margin:.5em 0}
.body code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--text) 8%,transparent);
  padding:.14em .38em;border-radius:3px}
.body pre{background:color-mix(in srgb,var(--text) 6%,transparent);border:1px solid var(--border);
  padding:16px 18px;overflow-x:auto;margin:1.5em 0;border-radius:4px;line-height:1.65}
.body pre code{background:none;padding:0;font-size:.84em}
.body img{max-width:100%;height:auto;display:block;margin:1.6em 0;border-radius:3px}
.body table{width:100%;border-collapse:collapse;margin:1.5em 0;font-size:.94em}
.body th,.body td{border-bottom:1px solid var(--border);padding:9px 12px;text-align:left}
.body th{color:var(--text-muted);font-weight:600;font-size:.9em}
.body a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.body a:hover{border-bottom-color:var(--accent)}
.body hr{border:0;border-top:1px solid var(--border);margin:2.4em 0}

.back{display:inline-block;font-family:var(--mono);font-size:.78rem;color:var(--text-muted);
  text-decoration:none;padding:26px 0 60px;transition:color .15s}
.back:hover{color:var(--accent)}

footer{border-top:1px solid var(--border);padding:34px 0 60px}
.foot-in{font-family:var(--mono);font-size:.74rem;color:var(--text-faint);line-height:2}
.foot-in a{color:var(--text-muted);text-decoration:none;border-bottom:1px solid var(--border)}
.foot-in a:hover{color:var(--accent)}

@media (max-width:600px){
  .wrap,.bar-in{padding-left:22px;padding-right:22px}
  .page-title{font-size:1.95rem;margin-top:52px}
  .article{padding:44px 0 30px}
  .article h1{font-size:1.6rem}
  .body{font-size:1.06rem;line-height:1.9}
  .posts h2{font-size:1.2rem}
  .posts a{padding:24px 0 22px}
}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="brand" href="../">patrick</a>
  <nav class="nav">
    <a href="../" class="on">首页</a><a href="../lab/">Lab</a>

<svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
  </nav>
</div></div>

<footer><div class="wrap"><div class="foot-in">
  © 2026 <a href="../about/">patrick</a>

<script>
(function(){
  var h=document.documentElement;
  try{var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;
      h.dataset.theme=s||(d?'dark':'light');}catch(e){}
  var t=document.getElementById('themeToggle');
  if(t)t.addEventListener('click',function(){
    var n=h.dataset.theme==='dark'?'light':'dark';
    h.classList.add('theme-switching');h.dataset.theme=n;
    try{localStorage.setItem('theme',n);}catch(e){}
    setTimeout(function(){h.classList.remove('theme-switching');},300);
  });
})();
</script>
</body>
</html>
