<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>Patrick · 小工具</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0e13;--card:#161b24;--line:#252d3a;--tx:#eef2f7;--dim:#8b97a8;--accent:#4d9fff}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 600px at 50% -10%,#161f2d 0%,var(--bg) 62%) fixed}
.wrap{max-width:760px;margin:0 auto;padding:64px 22px 90px}
.kicker{font-size:10px;letter-spacing:.24em;color:#e3b341;font-weight:700}
h1{font-size:30px;margin:10px 0 6px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:36px}
.grid{display:grid;gap:12px}
a.item{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:18px 18px;transition:.18s}
a.item:hover{border-color:#37455c;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.t{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.t .tag{font-size:10px;font-weight:700;color:#12210f;background:#e3b341;padding:2px 6px;border-radius:5px}
.d{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.6}
.u{color:var(--accent);font-size:11.5px;margin-top:9px;font-variant-numeric:tabular-nums}
footer{margin-top:44px;color:#4e5766;font-size:11.5px;line-height:1.8}
footer a{color:#5c6b82}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">PERSONAL TOOLS</div>
  <h1>小工具</h1>
  <div class="sub">一些自己用的小页面，纯静态，数据都存在浏览器本地。</div>

  <div class="grid">
    <a class="item" href="/tga/">
      <div class="t">TGA 年度游戏提名 <span class="tag">NEW</span></div>
      <div class="d">2014–2025 十二届「年度游戏」68 席全提名。五个状态勾选、平台标记、按可玩数算进度。</div>
      <div class="u">/tga/</div>
    </a>
  </div>

  <footer>
    根仓库：<a href="https://github.com/patrick12138/patrick12138.github.io">patrick12138/patrick12138.github.io</a><br>
    每个工具一个子目录，直接 push 到 main 即可更新。
  </footer>
</div>
</body>
</html>
