<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfbfa">
<title>随便写写 · Patrick</title>
<style>
*{box-sizing:border-box}
:root{
  --paper:#fbfbfa;
  --ink:#37352f;
  --ink2:#5f5c56;
  --grey:#787774;
  --faint:#9b9a97;
  --line:#e9e9e7;
  --hover:#f1f1ef;
  --link:#2383e2;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Noto Sans CJK SC",Helvetica,Arial,sans-serif;
}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6}

.wrap{max-width:708px;margin:0 auto;padding:76px 24px 120px}

/* icon + title */
.icon{font-size:56px;line-height:1;margin-bottom:18px}
h1{font-size:40px;font-weight:700;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px}
.sub{font-size:13.5px;color:var(--faint);margin:0 0 30px}

p{color:var(--ink);margin:0 0 16px;line-height:1.65}
.intro{font-size:16px;color:var(--ink2)}
.intro a{color:var(--ink);text-decoration:none;
  background-image:linear-gradient(transparent 62%,#e3e2e0 62%);background-size:100% 100%}

h2{font-size:20px;font-weight:600;margin:44px 0 10px;letter-spacing:-.01em}

/* divider */
hr{border:0;border-top:1px solid var(--line);margin:26px 0}

/* page links (notion-like) */
.list{margin:6px -10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:4px;
  text-decoration:none;color:inherit;transition:background .1s}
.item:hover{background:var(--hover)}
.item .ic{font-size:17px;line-height:1.6;flex:0 0 auto;width:20px;text-align:center;filter:saturate(.85)}
.item .tx{flex:1;min-width:0}
.item .tt{display:block;font-size:15.5px;font-weight:500;line-height:1.5}
.item .dd{display:block;font-size:13.5px;color:var(--grey);line-height:1.6;margin-top:2px}
.item .go{opacity:0;font-size:12px;color:var(--faint);margin-top:4px;flex:0 0 auto;transition:.12s}
.item:hover .go{opacity:1}

/* meta block */
.meta{font-size:13.5px;color:var(--grey);line-height:1.85}
.meta b{font-weight:500;color:var(--ink)}
.meta a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.meta a:hover{border-color:var(--faint)}

.sig{margin-top:52px;font-size:13.5px;color:var(--faint)}

@media (min-width:760px){
  .wrap{padding:104px 48px 140px}
  h1{font-size:46px}
  .icon{font-size:62px}
}

/* dark mode, like Notion's */
@media (prefers-color-scheme:dark){
  :root{--paper:#191919;--ink:#e9e9e7;--ink2:#c7c6c4;--grey:#9b9a97;--faint:#787774;
        --line:#2f2f2f;--hover:#252525}
  .intro a{background-image:linear-gradient(transparent 62%,#3a3a3a 62%)}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="icon">🗂️</div>
  <h1>随便写写</h1>
  <p class="sub">Patrick · 2026</p>



  <h2>页面</h2>
  <div class="list">
    <a class="item" href="/tga/">
      <span class="ic">🎮</span>
      <span class="tx">
        <span class="tt">TGA 年度游戏清单</span>
        <span class="dd">2014–2025 十二届「年度游戏」68 席提名，标记进度与想玩，算还要多少小时。</span>
      </span>
      <span class="go">→</span>
    </a>
  </div>

  <hr>

  <h2>关于</h2>
  <div class="meta">
    我不太爱换东西。软件、歌单、游戏，选定了就用很久。<br>
    这些页面也是照着「能用很多年」的想法做的——一个 HTML，一份内联数据，
    存在浏览器里，不依赖任何服务，哪天想改就改。<br><br>
    写代码之外，时间大多花在游戏、电影和羽毛球上。
    清单做得这么细，大概是因为看到数字会安心。
  </div>

  <div class="sig">— 想到什么就加一个页面。</div>

</div>
</body>
</html>
