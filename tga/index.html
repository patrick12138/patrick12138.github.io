<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101215">
<title>TGA 年度游戏 · 待玩清单</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#101215; --shell:#141619; --row:#141619; --row-hi:#191c20; --card2:#1b1e23;
  --line:#272b31; --line2:#33383f;
  --ink:#ecedef; --ink2:#a3a9b1; --muted:#787f88; --faint:#575d65;
  --gold:#d9a441; --gold-dim:#8a6a2e;
  --done:#5fae83; --half:#6d97bd; --want:#d9a441; --skip:#79818c; --no:#ad6a6a;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{position:sticky;top:0;z-index:20;background:rgba(16,18,21,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.shell-in{max-width:760px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:10px;height:52px}
.mark{width:20px;height:20px;border:1.5px solid var(--gold);display:grid;place-items:center;
  font-size:9px;font-weight:800;color:var(--gold);letter-spacing:-.02em;flex:0 0 auto}
.brand{font-size:13px;font-weight:700;letter-spacing:.01em}
.brand em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px}
.top .sp{flex:1}
.ghost{border:1px solid var(--line2);background:transparent;color:var(--ink2);
  font-size:11.5px;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:inherit}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- KPI strip (type, not tiles) ---------- */
.kpis{display:flex;gap:0;border-top:1px solid var(--line);padding:16px 0 14px}
.kpi{flex:1;min-width:0;padding-right:12px}
.kpi + .kpi{border-left:1px solid var(--line);padding-left:14px}
.kpi .k{font-size:10px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:5px}
.kpi .v{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi.hl .v{color:var(--gold)}
.kpi .sub{font-size:11px;color:var(--faint);margin-top:5px}

/* ---------- progress ---------- */
.line{height:3px;background:#22262c;display:flex;overflow:hidden;border-radius:2px}
.line i{display:block;height:100%;flex:0 0 auto;transition:width .3s cubic-bezier(.4,0,.2,1)}
.line .a{background:var(--done)}
.line .b{background:var(--half)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.legend b{color:var(--ink2);font-weight:600}
.legend em{font-style:normal;color:var(--faint);font-size:10px;margin-left:1px}

/* ---------- filters ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:13px 0 12px;
  border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:3px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);font-size:12px;cursor:pointer;font-family:inherit;
  transition:.13s;white-space:nowrap}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#0f1114;font-weight:650}

/* ---------- rows ---------- */
main{max-width:760px;margin:0 auto;padding:0 18px 40px}
.year{display:flex;align-items:baseline;gap:10px;margin:26px 0 2px}
.year .y{font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--faint)}
.year .w{font-size:11.5px;color:var(--gold-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.year .c{margin-left:auto;font-size:11px;color:var(--faint);flex:0 0 auto}

.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1d2025;transition:.12s}
.row:hover{background:var(--row-hi)}
.row[data-s="done"] .t{color:var(--done)}
.row[data-s="half"] .t{color:var(--half)}
.row[data-s="want"] .t{color:var(--want)}
.row[data-s="skip"] .t{color:var(--faint)}
.row[data-s="no"]{opacity:.55}
.info{flex:1;min-width:0}
.t{font-size:14.5px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:6px}
.goty{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#12140f;background:var(--gold);
  padding:1.5px 4px;border-radius:2px;flex:0 0 auto}
.m{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:10.5px;color:var(--faint);min-width:0}
.m .en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plats{display:flex;gap:3px;flex:0 0 auto}
@media (max-width:859px){ .plats .pl ~ .pl{display:none} }
.pl{font-size:8.5px;font-weight:700;letter-spacing:.03em;padding:1px 3.5px;border-radius:2px;
  border:1px solid;line-height:1.35}
.pl.pc{color:#8fb8e0;border-color:#2f4257}
.pl.ps{color:#9aa5d8;border-color:#3a3f63}
.pl.ns{color:#d79a9a;border-color:#573a3a}
.pl.xb{color:#8fc4a1;border-color:#2f4a39}

.dur{flex:0 0 auto;text-align:right;margin-left:auto;padding-left:8px;white-space:nowrap;min-width:52px;font-size:11.5px;color:var(--ink2);line-height:1.35}
.dur b{font-size:13.5px;font-weight:700;color:var(--ink)}
.dur .to{color:var(--faint);font-size:10.5px}
.row[data-s="want"] .dur b{color:var(--gold)}

.acts{display:flex;gap:3px;flex:0 0 auto}
.b{width:26px;height:26px;border-radius:4px;border:1px solid var(--line2);background:transparent;
  color:#5b626b;font-size:12px;display:grid;place-items:center;cursor:pointer;
  transition:.13s;padding:0;line-height:1;font-family:inherit}
.b:hover{background:var(--card2);color:var(--ink2)}
.b:active{transform:scale(.92)}
.b[data-v="done"].on{color:var(--done);border-color:var(--done);background:rgba(95,174,131,.1)}
.b[data-v="half"].on{color:var(--half);border-color:var(--half);background:rgba(109,151,189,.1)}
.b[data-v="want"].on{color:var(--want);border-color:var(--gold-dim);background:rgba(217,164,65,.1)}
.b[data-v="skip"].on{color:var(--ink2);border-color:var(--muted)}
.b[data-v="no"].on{color:var(--no);border-color:var(--no);background:rgba(173,106,106,.09)}

/* ---------- footer ---------- */
.foot{max-width:760px;margin:0 auto;padding:22px 18px 46px;border-top:1px solid var(--line)}
.foot .btns{display:flex;gap:8px;margin-bottom:16px}
.foot .btns button{flex:1;border:1px solid var(--line2);background:transparent;color:var(--ink2);
  font-size:12.5px;padding:10px;border-radius:4px;cursor:pointer;font-family:inherit}
.foot .btns button:hover{color:var(--ink);border-color:var(--muted)}
.foot p{font-size:10.5px;color:var(--faint);line-height:1.8;margin:0}
.foot a{color:var(--muted)}
.foot .back-home{display:inline-block;margin-top:20px;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em;color:var(--muted);text-decoration:none;transition:color .15s}
.foot .back-home:hover{color:var(--accent)}

.empty{padding:40px 0;text-align:center;font-size:12.5px;color:var(--faint);display:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);opacity:0;
  background:#22262c;color:var(--ink);padding:8px 15px;border-radius:4px;font-size:12px;
  pointer-events:none;transition:.2s;z-index:50;border:1px solid var(--line2);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- PC ---------- */
@media (min-width:860px){
  .shell-in,main,.foot{max-width:1000px;padding-left:28px;padding-right:28px}
  .top{height:58px}
  .brand{font-size:14px}
  .kpis{padding:22px 0 18px}
  .kpi .v{font-size:40px}
  .kpi .k{font-size:10.5px;margin-bottom:7px}
  .kpi .sub{font-size:11.5px}
  .kpi + .kpi{padding-left:22px}
  .row{padding:12px 10px 12px 8px;gap:26px}
  .info{flex:1}
  .dur{margin-left:0;width:112px;padding-left:0}
  .row:hover{background:#191c20}
  .t{font-size:15.5px}
  .b{width:29px;height:29px;font-size:12.5px}
  .year{margin-top:32px}
  .dur b{font-size:14.5px}
}
@media (min-width:1100px){
  .shell-in,main,.foot{max-width:1060px}
}
</style>
</head>
<body>

<div class="shell">
  <div class="shell-in">
    <div class="top">
      <div class="mark">TG</div>
      <div class="brand">年度游戏提名<em>TGA 2014–2025 · 68 席</em></div>
      <div class="sp"></div>
      <button class="ghost" id="btnReset">重来</button>
    </div>
    <div class="kpis">
      <div class="kpi hl">
        <div class="k">还要玩</div>
        <div class="v"><span id="kHours">0</span><small>小时</small></div>
        <div class="sub" id="kDays">按每天 3 小时 · —</div>
      </div>
      <div class="kpi">
        <div class="k">待玩</div>
        <div class="v"><span id="kWant">0</span><small>款</small></div>
        <div class="sub" id="kWantSub">在可玩 54 席里</div>
      </div>
      <div class="kpi">
        <div class="k">已玩过</div>
        <div class="v"><span id="kPlayed">0</span><small>款</small></div>
        <div class="sub" id="kPlayedSub">通关 0 · 没通 0</div>
      </div>
    </div>
    <div class="line"><i class="a" id="barA"></i><i class="b" id="barB"></i></div>
    <div class="legend">
      <span>想玩 <b id="lgWantH">0</b>h</span>
      <span>没通 <b id="lgHalfH">0</b>h<em>×½</em></span>
      <span>可玩 <b id="lgPlayable">54</b> 席</span>
      <span>平台受限 <b id="lgLocked">14</b></span>
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="todo">待标记</button>
      <button class="chip" data-f="want">想玩</button>
      <button class="chip" data-f="played">玩过</button>
      <button class="chip" data-f="no">没得玩</button>
    </div>
  </div>
</div>

<main id="list"></main>
<div class="empty" id="empty">这个筛选下没有条目</div>

<div class="foot">
  <div class="btns">
    <button id="btnCopy">复制结果</button>
    <button id="btnWalk">只看想玩</button>
  </div>
  <p>
    数据：提名与获奖来自 <a href="https://www.gamemall.org/zh/tga">GameMall TGA 档案</a>；
    时长来自 HowLongToBeat（主线 → 全收集，社区中位数）。平台按 2026-11 现状标注，无 PC 版的 14 席预置为「没得玩」。<br>
    勾选只存在这台设备的浏览器里，不上传。<br>
    「还要玩」= 想玩的全收集时长 + 玩过没通的按全收集一半估。
  </p>
  <a class="back-home" href="../">← 返回首页</a>
</div>

<div id="toast"></div>

": "炉石传说", "en": "Hearthstone", "w": false, "pc": true, "plats": ["PC"], "main": 38.0, "comp": null, "endless": true}, {"zh": "中土世界：暗影魔多", "en": "Middle-earth: Shadow of Mordor", "w": false, "pc": true, "plats": ["PC", "PS4", "XB1"], "main": 15.5, "comp": 33.0, "endless": false}]}]</script>
<script>
var YEARS = JSON.parse(document.getElementById('data').textContent);
var KEY = 'tga_checklist_v2';
var LABEL = {done:'✓ 通关', half:'◐ 玩过没通', want:'♡ 想玩', skip:'✕ 不打算玩', no:'⊘ 没得玩'};
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { state = {}; }
var filter = 'all', cards = [];
// 之前会话里点名要玩的：默认标成「想玩」，用户自己的勾选优先
var PRESET = {'战神：诸神黄昏':'want', '空洞骑士：丝之歌':'want'};

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function keyOf(y,i){ return y + ':' + i; }
function eff(k, pc, zh){
  var v = state[k];
  if (v) return v;
  if (zh && PRESET[zh]) return PRESET[zh];
  return pc ? '' : 'no';
}
function h(n){ return (n === null || n === undefined) ? null : Math.round(n); }

function build(){
  var out = '';
  YEARS.forEach(function(yr){
    var w = yr.games.filter(function(g){ return g.w; })[0];
    out += '<div class="year"><span class="y">'+yr.year+'</span>'
        +  '<span class="w">'+ (w ? w.zh : '') +'</span>'
        +  '<span class="c" data-yc="'+yr.year+'"></span></div>';
    yr.games.forEach(function(g, i){
      var k = keyOf(yr.year, i), pc = g.pc ? 1 : 0;
      var plats = (g.plats||[]).map(function(p){
        var c = p.indexOf('PC')===0?'pc':p.indexOf('PS')===0?'ps':p.indexOf('NS')===0?'ns':'xb';
        return '<span class="pl '+c+'">'+p+'</span>';
      }).join('');
      var dur = '';
      if (g.endless) {
        dur = '<span class="dur"><b>长期</b></span>';
      } else if (g.main != null) {
        dur = '<span class="dur"><b>'+h(g.main)+'</b>h'
            + (g.comp != null && g.comp !== g.main ? ' <span class="to">→ '+h(g.comp)+'h</span>' : '')
            + '</span>';
      } else {
        dur = '';
      }
      out += '<div class="row" data-k="'+k+'" data-pc="'+pc+'" data-zh="'+g.zh+'" data-main="'+(g.main||0)+'" data-comp="'+(g.comp||g.main||0)+'">'
          +  '<div class="info"><div class="t">'+g.zh + (g.w?'<span class="goty">GOTY</span>':'') +'</div>'
          +  '<div class="m"><span class="plats">'+plats+'</span>'
          +  (g.en && g.en!==g.zh ? '<span class="en">'+g.en+'</span>' : '')
          +  dur + '</div></div>'
          +  '<div class="acts">'
          +  '<button class="b" data-v="done" title="通关">✓</button>'
          +  '<button class="b" data-v="half" title="玩过没通">◐</button>'
          +  '<button class="b" data-v="want" title="想玩">♡</button>'
          +  '<button class="b" data-v="skip" title="不打算玩">✕</button>'
          +  '<button class="b" data-v="no" title="没得玩">⊘</button>'
          +  '</div></div>';
    });
  });
  document.getElementById('list').innerHTML = out;
  cards = Array.prototype.slice.call(document.querySelectorAll('.row'));
}

function paint(){
  var n = {done:0, half:0, want:0, skip:0, no:0, blank:0}, playable = 0;
  var wantHours = 0, halfHours = 0, wantCount = 0, halfCount = 0;
  cards.forEach(function(c){
    var k = c.dataset.k, pc = c.dataset.pc === '1';
    if (pc) playable++;
    var v = eff(k, pc, c.dataset.zh);
    c.dataset.s = v || '';
    Array.prototype.forEach.call(c.querySelectorAll('.b'), function(b){
      b.classList.toggle('on', v === b.dataset.v);
    });
    if (v) n[v]++; else n.blank++;
    if (v === 'want') { wantCount++; wantHours += parseFloat(c.dataset.comp) || 0; }
    if (v === 'half') { halfCount++; halfHours += (parseFloat(c.dataset.comp) || 0) * 0.5; }
    var show = filter === 'all'
      || (filter === 'todo' && !v)
      || (filter === 'want' && v === 'want')
      || (filter === 'played' && (v === 'done' || v === 'half'))
      || (filter === 'no' && v === 'no');
    c.style.display = show ? '' : 'none';
  });

  var hours = wantHours + halfHours;
  document.getElementById('kHours').textContent = Math.round(hours);
  document.getElementById('kDays').textContent = hours > 0
    ? '每天 3 小时 · ' + Math.ceil(hours / 3) + ' 天'
    : '把想玩的标上就出来了';
  document.getElementById('kWant').textContent = wantCount + halfCount;
  document.getElementById('kWantSub').textContent = '想玩 ' + wantCount + ' · 没通 ' + halfCount;
  document.getElementById('kPlayed').textContent = n.done;
  document.getElementById('kPlayedSub').textContent = '可玩 ' + playable + ' 席里';
  document.getElementById('lgWantH').textContent = Math.round(wantHours);
  document.getElementById('lgHalfH').textContent = Math.round(halfHours);
  document.getElementById('lgPlayable').textContent = playable;
  document.getElementById('lgLocked').textContent = n.no;
  document.getElementById('barA').style.width = (playable ? n.done / playable * 100 : 0) + '%';
  document.getElementById('barB').style.width = (playable ? n.half / playable * 100 : 0) + '%';

  YEARS.forEach(function(yr){
    var el = document.querySelector('[data-yc="'+yr.year+'"]'); if (!el) return;
    var y = 0, p = 0;
    yr.games.forEach(function(g, i){
      var pc = g.pc ? 1 : 0; if (pc) p++;
      var v = eff(keyOf(yr.year, i), pc, g.zh);
      if (v === 'done' || v === 'half') y++;
    });
    el.textContent = p ? (y + '/' + p) : '—';
  });

  var any = cards.some(function(c){ return c.style.display !== 'none'; });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(window.__tt); window.__tt = setTimeout(function(){ t.classList.remove('on'); }, 1500);
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest('.b');
  if (b) {
    var row = b.closest('.row'), k = row.dataset.k, v = b.dataset.v;
    var cur = eff(k, row.dataset.pc === '1', row.dataset.zh);
    if (cur === v) delete state[k]; else state[k] = v;
    save(); paint();
    if (cur !== v) toast(LABEL[v]);
    return;
  }
  var chip = ev.target.closest('.chip');
  if (chip) {
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    chip.classList.add('on'); filter = chip.dataset.f; paint();
  }
});

document.getElementById('btnReset').onclick = function(){
  if (!confirm('清空所有勾选？')) return;
  state = {}; save(); paint(); toast('已清空');
};

document.getElementById('btnCopy').onclick = function(){
  var g = {done:[], half:[], want:[], skip:[], no:[]};
  YEARS.forEach(function(yr){
    yr.games.forEach(function(x, i){
      var v = eff(keyOf(yr.year, i), x.pc, x.zh);
      if (v) g[v].push(yr.year + ' ' + x.zh + (x.comp ? '（' + h(x.comp) + 'h）' : ''));
    });
  });
  var hrs = 0;
  cards.forEach(function(c){
    var v = eff(c.dataset.k, c.dataset.pc === '1', c.dataset.zh);
    if (v === 'want') hrs += parseFloat(c.dataset.comp) || 0;
    if (v === 'half') hrs += (parseFloat(c.dataset.comp) || 0) * 0.5;
  });
  var head = {done:'✅ 通关', half:'◐ 玩过没通', want:'♡ 想玩', skip:'✕ 不打算玩', no:'⊘ 没得玩'};
  var L = ['TGA 年度游戏提名 2014–2025 · 我的进度'];
  ['done','half','want','skip','no'].forEach(function(s){
    if (!g[s].length) return;
    L.push(''); L.push(head[s] + '（' + g[s].length + '）'); L.push(g[s].join('、'));
  });
  L.push(''); L.push('待玩合计 ' + Math.round(hrs) + ' 小时（没通的按一半算），按每天 3 小时约 ' + Math.ceil(hrs/3) + ' 天');
  var txt = L.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制'); }, function(){ fb(txt); });
  } else fb(txt);
  function fb(t){
    var ta = document.createElement('textarea'); ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
};

build(); paint();
</script>
