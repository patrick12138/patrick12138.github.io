<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>TGA 年度游戏提名 · 玩过没</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0e13; --card:#161b24; --card2:#1d2430; --line:#252d3a;
  --tx:#eef2f7; --dim:#8b97a8; --gold:#e3b341;
  --done:#2ecc8f; --half:#3fb0d6; --want:#4d9fff; --skip:#6b7686; --no:#c05f5f;
  --pc:#4d9fff; --ps:#7b8cff; --ns:#ff6b6b; --xb:#4bd07a;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:8px}

header{position:sticky;top:0;z-index:20;background:rgba(11,14,19,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:13px 16px 9px}
.kicker{font-size:9.5px;letter-spacing:.22em;color:var(--gold);font-weight:700;margin-bottom:5px}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px}
h1 span{color:var(--dim);font-weight:500;font-size:12.5px}
.top{display:flex;align-items:baseline;gap:8px;margin-top:11px}
.top b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--done)}
.top .of{font-size:12px;color:var(--dim)}
.top .pct{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:#202836;margin:7px 0 7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;flex:0 0 auto;transition:width .28s cubic-bezier(.4,0,.2,1)}
.bar .a{background:linear-gradient(90deg,#2ecc8f,#25b47c)}
.bar .b{background:linear-gradient(90deg,#3fb0d6,#2f96ba)}
.micro{display:flex;gap:11px;font-size:11px;color:var(--dim);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.micro b{font-weight:700;font-size:11.5px}
.micro .d b{color:var(--done)} .micro .h b{color:var(--half)}
.micro .w b{color:var(--want)} .micro .s b{color:#98a3b3} .micro .n b{color:var(--no)}
.tabs{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:6px 12px;border-radius:99px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);font-size:12.5px;cursor:pointer;transition:.15s}
.tab.on{background:#22344b;border-color:#35507a;color:#cfe3ff}

main{max-width:720px;margin:0 auto;padding:0 16px}
.yr{margin-top:24px}
.yr-hd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.yr-hd .y{font-size:21px;font-weight:800;letter-spacing:-.02em}
.yr-hd .t{font-size:11.5px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yr-hd .c{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}

.card{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:7px;transition:.15s}
.card[data-s="done"]{border-color:rgba(46,204,143,.45);background:linear-gradient(90deg,rgba(46,204,143,.09),var(--card) 60%)}
.card[data-s="half"]{border-color:rgba(63,176,214,.4);background:linear-gradient(90deg,rgba(63,176,214,.08),var(--card) 60%)}
.card[data-s="want"]{border-color:rgba(77,159,255,.35)}
.card[data-s="skip"]{opacity:.6}
.card[data-s="no"]{opacity:.5;border-style:dashed}
.card[data-s="skip"] .name,.card[data-s="no"] .name{color:#a8b3c2}
.nm{flex:1;min-width:0}
.name{font-size:14.5px;font-weight:650;line-height:1.3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.win{font-size:9px;font-weight:700;color:#12210f;background:var(--gold);
  padding:2px 5px;border-radius:4px;letter-spacing:.04em;flex:0 0 auto}
.sub{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}
.en{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.plats{display:flex;gap:3px;flex:0 0 auto}
.pl{font-size:8.5px;font-weight:800;padding:1.5px 4px;border-radius:3.5px;letter-spacing:.03em;line-height:1.25}
.pl.pc{color:var(--pc);background:rgba(77,159,255,.15)}
.pl.ps{color:#aab4ff;background:rgba(123,140,255,.16)}
.pl.ns{color:#ff9a9a;background:rgba(255,107,107,.16)}
.pl.xb{color:#7de39d;background:rgba(75,208,122,.15)}

.btns{display:flex;gap:4px;flex:0 0 auto}
.b{width:29px;height:29px;border-radius:9px;border:1px solid var(--line);background:var(--card2);
  color:#5f6b7c;font-size:13px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s;padding:0;line-height:1;font-family:inherit}
.b:active{transform:scale(.9)}
.b[data-v="done"].on{background:rgba(46,204,143,.18);border-color:var(--done);color:var(--done)}
.b[data-v="half"].on{background:rgba(63,176,214,.18);border-color:var(--half);color:var(--half)}
.b[data-v="want"].on{background:rgba(77,159,255,.18);border-color:var(--want);color:var(--want)}
.b[data-v="skip"].on{background:rgba(120,132,150,.2);border-color:#8b95a5;color:#cdd5e0}
.b[data-v="no"].on{background:rgba(192,95,95,.16);border-color:var(--no);color:#e08484}

footer{max-width:720px;margin:32px auto 0;padding:0 16px;color:#4e5766;font-size:11px;line-height:1.75}
footer a{color:#5c6b82}
.fab{display:flex;gap:8px;max-width:720px;margin:10px auto 0;padding:0 16px}
.fab button{flex:1;border:1px solid var(--line);background:#1a2130;color:#c3cddb;font-size:13px;
  padding:12px 13px;border-radius:13px;cursor:pointer;font-family:inherit}
.fab button:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,14px);opacity:0;
  background:#22344b;color:#dbe9ff;padding:9px 16px;border-radius:99px;font-size:12.5px;
  pointer-events:none;transition:.22s;z-index:50;border:1px solid #33507c;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width: 819px){ .plats .pl ~ .pl{display:none} }
.empty{color:var(--dim);font-size:13px;padding:24px 4px;text-align:center;display:none}

/* ---------- PC / 宽屏 ---------- */
@media (min-width: 820px) {
  body{background:radial-gradient(1200px 600px at 50% -10%,#131a26 0%,var(--bg) 60%) fixed}
  .hd{max-width:1080px;padding:20px 24px 14px}
  h1{font-size:22px}
  .top b{font-size:26px}
  .micro{font-size:12px;gap:16px}
  main{max-width:1080px;padding:0 24px}
  .yr{margin-top:34px}
  .yr-hd .y{font-size:26px}
  .yr-hd .t{font-size:13px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
  .card{margin:0;padding:12px 12px 12px 14px}
  .card:hover{border-color:#37455c;transform:translateY(-1px);
    box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .card[data-s="done"]:hover{border-color:rgba(46,204,143,.7)}
  .name{font-size:15.5px}
  .en{font-size:11.5px}
  .b{width:33px;height:33px;font-size:14px}
  .b:hover{background:#2a3446;color:#9fb0c6;border-color:#3d4a60}
  footer,.fab{max-width:1080px;padding:0 24px}
  .fab{margin:16px auto 0}
  .fab button{flex:0 0 auto;min-width:150px}
  .fab{justify-content:center}
  .tab:hover{color:#cfe3ff;border-color:#35507a}
}
@media (min-width: 1280px) {
  .cards{grid-template-columns:1fr 1fr 1fr}
  .hd,main,footer,.fab{max-width:1320px}
}

</style>
</head>

<script>
var YEARS = JSON.parse(document.getElementById('data').textContent);
var KEY = 'tga_checklist_v2', OLD = 'tga_checklist_v1';
var LABEL = {done:'✓ 通关', half:'◐ 玩过没通', want:'♡ 想加进待玩', skip:'✕ 不打算玩', no:'⊘ 没得玩'};

var state = {};
try {
  var raw = localStorage.getItem(KEY);
  if (raw) state = JSON.parse(raw) || {};
  else {
    var old = JSON.parse(localStorage.getItem(OLD) || 'null');
    if (old) { // 迁移旧版 yes/no
      Object.keys(old).forEach(function(k){
        if (old[k] === 'yes') state[k] = 'done';
        else if (old[k] === 'no') state[k] = 'skip';
      });
    }
  }
} catch(e) { state = {}; }
var filter = 'all';

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function keyOf(y,i){ return y + ':' + i; }
// 没有 PC 版的：默认视为「没得玩」，除非用户手动改过
function eff(k, pc){ var v = state[k]; if (v) return v; return pc ? '' : 'no'; }

var cards = [];

function build(){
  var h = '';
  YEARS.forEach(function(yr){
    var w = yr.games.filter(function(g){ return g.w; })[0];
    h += '<section class="yr"><div class="yr-hd"><span class="y">'+yr.year+'</span>'
      +  '<span class="t">'+ (w ? w.zh : '') +'</span>'
      +  '<span class="c" data-yc="'+yr.year+'"></span></div><div class="cards">';
    yr.games.forEach(function(g, i){
      var k = keyOf(yr.year, i), pc = g.pc ? 1 : 0;
      var plats = (g.plats||[]).map(function(p){
        var c = p.indexOf('PC')===0?'pc':p.indexOf('PS')===0?'ps':p.indexOf('NS')===0?'ns':'xb';
        return '<span class="pl '+c+'">'+p.replace('Switch','NS').replace('Nintendo','NS')+'</span>';
      }).join('');
      h += '<div class="card" data-k="'+k+'" data-year="'+yr.year+'" data-pc="'+pc+'">'
        +  '<div class="nm"><div class="name">'+g.zh + (g.w?'<span class="win">GOTY</span>':'') +'</div>'
        +  '<div class="sub">'+(g.en && g.en!==g.zh?'<span class="en">'+g.en+'</span>':'<span class="en"></span>')
        +  '<span class="plats">'+plats+'</span></div></div>'
        +  '<div class="btns">'
        +  '<button class="b" data-v="done" aria-label="通关">✓</button>'
        +  '<button class="b" data-v="half" aria-label="玩过没通">◐</button>'
        +  '<button class="b" data-v="want" aria-label="想玩">♡</button>'
        +  '<button class="b" data-v="skip" aria-label="不打算玩">✕</button>'
        +  '<button class="b" data-v="no" aria-label="没得玩">⊘</button>'
        +  '</div></div>';
    });
    h += '</div></section>';
  });
  document.getElementById('list').innerHTML = h;
  cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
}

function paint(){
  var n = {done:0, half:0, want:0, skip:0, no:0, blank:0}, playable = 0;
  cards.forEach(function(c){
    var k = c.dataset.k, pc = c.dataset.pc === '1';
    if (pc) playable++;
    var v = eff(k, pc);
    c.dataset.s = v || '';
    Array.prototype.forEach.call(c.querySelectorAll('.b'), function(b){
      b.classList.toggle('on', v === b.dataset.v);
    });
    if (v) n[v]++; else n.blank++;
    var show = filter === 'all'
      || (filter === 'todo' && !v)
      || (filter === 'played' && (v==='done'||v==='half'))
      || (filter === 'want' && v==='want')
      || (filter === 'no' && v==='no');
    c.style.display = show ? '' : 'none';
  });
  var played = n.done + n.half;
  document.getElementById('cDone').textContent = played;
  document.getElementById('ofTotal').textContent = '/ ' + playable + ' 可玩';
  document.getElementById('pct').textContent = (playable ? Math.round(played/playable*100) : 0) + '%';
  document.getElementById('barA').style.width = (playable ? n.done/playable*100 : 0) + '%';
  document.getElementById('barB').style.width = (playable ? n.half/playable*100 : 0) + '%';
  document.getElementById('mDone').textContent = n.done;
  document.getElementById('mHalf').textContent = n.half;
  document.getElementById('mWant').textContent = n.want;
  document.getElementById('mSkip').textContent = n.skip;
  document.getElementById('mNo').textContent = n.no;
  YEARS.forEach(function(yr){
    var el = document.querySelector('[data-yc="'+yr.year+'"]'); if(!el) return;
    var y=0, tot=yr.games.length, p=0;
    yr.games.forEach(function(g,i){
      var pc = g.pc ? 1 : 0; if (pc) p++;
      var v = eff(keyOf(yr.year,i), pc);
      if (v==='done'||v==='half') y++;
    });
    el.textContent = p ? (y+'/'+p) : ('— /'+tot);
    el.style.color = (p && y===p) ? 'var(--done)' : '';
  });
  var any = cards.some(function(c){ return c.style.display !== 'none'; });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(window.__tt); window.__tt = setTimeout(function(){ t.classList.remove('on'); }, 1500);
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest('.b');
  if (b) {
    var card = b.closest('.card'), k = card.dataset.k, v = b.dataset.v;
    var cur = eff(k, card.dataset.pc === '1');
    if (cur === v) { delete state[k]; } else { state[k] = v; }
    save(); paint();
    if (cur !== v) toast(LABEL[v]);
    return;
  }
  var tab = ev.target.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
    tab.classList.add('on'); filter = tab.dataset.f; paint();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
});

document.getElementById('btnReset').onclick = function(){
  if (!confirm('清空所有标记？（主机独占会自动恢复成「没得玩」）')) return;
  state = {}; save(); paint(); toast('已重来');
};

document.getElementById('btnCopy').onclick = function(){
  var groups = {done:[], half:[], want:[], skip:[], no:[]};
  YEARS.forEach(function(yr){
    yr.games.forEach(function(g,i){
      var v = eff(keyOf(yr.year,i), g.pc);
      if (v) groups[v].push(yr.year + ' ' + g.zh);
    });
  });
  var head = {done:'✅ 通关过（', half:'◐ 玩过没通（', want:'♡ 想玩（', skip:'✕ 不打算玩（', no:'⊘ 没得玩·平台限制（'};
  var L = ['TGA 年度游戏提名 2014–2025 · 我的游玩情况'];
  ['done','half','want','skip','no'].forEach(function(g){
    if (!groups[g].length) return;
    L.push('');
    L.push(head[g] + groups[g].length + '）');
    L.push(groups[g].join('、'));
  });
  var p = 0, y = 0;
  cards.forEach(function(c){
    if (c.dataset.pc === '1') p++;
    var v = eff(c.dataset.k, c.dataset.pc === '1');
    if (v==='done'||v==='half') y++;
  });
  L.push('');
  L.push('—— 可玩 ' + p + ' 席中玩过 ' + y + ' 席（' + Math.round(y/p*100) + '%）');
  var txt = L.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); }, function(){ fb(txt); });
  } else fb(txt);
  function fb(t){
    var ta = document.createElement('textarea'); ta.value = t;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
};

build(); paint();
</script>
</body>
</html>
