<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>
:root,[data-theme="dark"]{
  --bg:#0a0c10;--text:#dfe5ec;--text-muted:#98a2b0;--border:#191d24;--accent:#6aa2d8;
  --sans:'Figtree',-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{--bg:#f3f5f8;--text:#1e2935;--text-muted:#526070;--border:#dfe4ea;--accent:#2d6496}
[data-theme="sepia"]{--bg:#f4ecd8;--text:#3b3327;--text-muted:#7a6e58;--border:#e0d4b8;--accent:#8a6a2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{display:flex;flex-direction:column}

/* 顶栏：默认隐藏，点正文中间唤出 */
#bar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(48px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);transition:transform .22s ease,opacity .22s ease}
#bar.hide{transform:translateY(-101%);opacity:0;pointer-events:none}
#title{flex:1;min-width:0;font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--text);text-align:center}
.btn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;border-radius:8px;color:var(--text-muted);cursor:pointer}
.btn:active{background:color-mix(in srgb,var(--text) 12%,transparent)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* 阅读区 */
#viewer{flex:1;min-height:0;padding:calc(6px + env(safe-area-inset-top)) 18px 10px}
#pct{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;
  font-family:var(--mono);font-size:.66rem;color:var(--text-muted);opacity:.55;
  transition:opacity .3s;pointer-events:none}
#pct.fade{opacity:0}
#meter{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);width:0;
  z-index:35;transition:width .3s ease;opacity:.7}

/* 目录抽屉 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45;opacity:0;
  pointer-events:none;transition:opacity .22s}
#mask.on{opacity:1;pointer-events:auto}
#toc{position:fixed;top:0;bottom:0;left:0;width:min(84vw,340px);z-index:50;
  background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;
  transform:translateX(-101%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
#toc.on{transform:none}
#toc h2{margin:0;padding:calc(16px + env(safe-area-inset-top)) 18px 12px;font-size:.72rem;
  font-family:var(--mono);letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;
  border-bottom:1px solid var(--border);font-weight:600}
#toclist{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
#toclist a{display:block;padding:9px 18px;font-size:.86rem;line-height:1.45;color:var(--text);
  text-decoration:none;border-left:2px solid transparent}
#toclist a.lv2{padding-left:32px;font-size:.78rem;color:var(--text-muted)}
#toclist a.on{color:var(--accent);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* 设置面板 */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:52;background:var(--bg);
  border-top:1px solid var(--border);border-radius:14px 14px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
#panel.on{transform:none}
.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.row>span{flex:none;width:56px;font-size:.74rem;color:var(--text-muted)}
.seg{flex:1;display:flex;gap:6px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--border);background:none;color:var(--text);
  border-radius:8px;font-size:.8rem;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:60;background:var(--bg);font-size:.84rem;color:var(--text-muted);
  text-align:center;padding:24px;transition:opacity .3s}
#boot.gone{opacity:0;pointer-events:none}
#boot b{font-weight:600;color:var(--text);font-size:.95rem;display:block;margin-bottom:6px}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (min-width:721px){
  #viewer{padding:26px 44px 18px}
  #toc{width:320px}
}
</style>
</head>
<body>
<header id="bar">
  <button class="btn" id="btn-toc" aria-label="目录">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div id="title">{{TITLE}}</div>
  <button class="btn" id="btn-set" aria-label="设置">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
  </button>
</header>

<div id="viewer"></div>
<div id="meter"></div>
<div id="pct"></div>

<div id="mask"></div>
<aside id="toc"><h2>目录</h2><div id="toclist"></div></aside>
<div id="panel">
  <div class="row"><span>字号</span><div class="seg" id="seg-size">
    <button data-sz="88">小</button><button data-sz="100">中</button><button data-sz="116">大</button></div></div>
  <div class="row"><span>底色</span><div class="seg" id="seg-theme">
    <button data-th="dark">深色</button><button data-th="light">浅色</button><button data-th="sepia">羊皮纸</button></div></div>
</div>

<div id="boot"><div class="spin"></div><div>载入中…</div></div>

<script src="../lib/jszip.min.js"></script>
<script src="../lib/epub.min.js"></script>
<script>
(function(){
  var SLUG = {{SLUG}};
  var K = function(n){ return 'rd:' + SLUG + ':' + n; };
  var $ = function(id){ return document.getElementById(id); };
  var boot = $('boot'), bar = $('bar'), pct = $('pct'), meter = $('meter');

  function fail(msg, sub){
    boot.className = '';
    boot.innerHTML = '<div><b>' + msg + '</b><div style="font-size:.78rem;line-height:1.7">' + (sub||'') + '</div></div>';
  }

  /* ---- 主题 / 字号 ---- */
  var html = document.documentElement;
  html.setAttribute('data-theme', localStorage.getItem(K('ui')) || 'dark');
  var sz = localStorage.getItem(K('sz')) || '100';
  var barHidden = false;

  function syncSegs(){
    Array.prototype.forEach.call($('seg-size').children, function(b){ b.classList.toggle('on', b.dataset.sz === sz); });
    var th = html.getAttribute('data-theme');
    Array.prototype.forEach.call($('seg-theme').children, function(b){ b.classList.toggle('on', b.dataset.th === th); });
  }

  var INK = {
    dark:  {bg:'#0a0c10', fg:'#dfe5ec', link:'#6aa2d8'},
    light: {bg:'#f3f5f8', fg:'#1e2935', link:'#2d6496'},
    sepia: {bg:'#f4ecd8', fg:'#3b3327', link:'#8a6a2f'}
  };

  function paint(){
    if (!window.rendition) return;
    var th = html.getAttribute('data-theme'), c = INK[th] || INK.dark;
    try {
      rendition.getContents().forEach(function(v){
        var d = v && v.document;
        if (!d) return;
        d.documentElement.style.setProperty('background', c.bg, 'important');
        if (d.body) {
          d.body.style.setProperty('background', c.bg, 'important');
          d.body.style.setProperty('color', c.fg, 'important');
        }
      });
      rendition.themes.fontSize(sz + '%');
    } catch (e) {}
  }

  /* ---- 载入 ---- */
  if (!window.ePub) { fail('阅读器没加载出来', 'lib/epub.min.js 取不到，检查部署。'); return; }

  var book, rendition;
  try {
    book = ePub('book.epub');
  } catch (e) {
    fail('打不开这本书', String(e && e.message || e));
    return;
  }
  window.rendition = rendition = book.renderTo('viewer', {
    width: '100%', height: '100%', flow: 'paginated', spread: 'none', allowScriptedContent: false
  });
  var c0 = INK[html.getAttribute('data-theme')] || INK.dark;
  rendition.themes.default({
    'html': {'background': c0.bg},
    'body': {'background': c0.bg, 'color': c0.fg},
    'a': {'color': c0.link}
  });

  var booted = false;
  rendition.on('rendered', function(){ if (!booted) { booted = true; boot.classList.add('gone'); } });
  setTimeout(function(){ if (!booted) { booted = true; boot.classList.add('gone'); } }, 8000);

  book.ready.then(function(){
    var saved = null;
    try { saved = localStorage.getItem(K('cfi')); } catch (e) {}
    var p = saved ? rendition.display(saved) : rendition.display();
    if (p && p.catch) p.catch(function(){ rendition.display(); });
    paint();
    syncSegs();
    buildToc();
    setTimeout(function(){
      if (book.spine.length > 240) return;              // 超大合集不做全文索引，用章节估算
      try {
        var g = book.locations.generate(1400);
        if (g && g.then) g.then(function(){ locReady = true; if (lastLoc) updPct(lastLoc); }).catch(function(){});
      } catch (e) {}
    }, 1200);
  }).catch(function(err){
    fail('这本书读不了', (err && err.message) || '文件可能不是有效的 EPUB，或者还在传。');
  });

  book.loaded.metadata.then(function(m){
    if (m && m.title) { $('title').textContent = m.title; document.title = m.title; }
  }).catch(function(){});

  /* ---- 目录 ---- */
  function buildToc(){
    book.loaded.navigation.then(function(nav){
      var box = $('toclist');
      box.innerHTML = '';
      (nav.toc || []).forEach(function(it){
        var a = document.createElement('a');
        a.href = 'javascript:void 0';
        a.textContent = it.label.trim();
        if (it.level && it.level > 1) a.className = 'lv2';
        a.onclick = function(){ rendition.display(it.href); closeToc(); };
        a.dataset.href = it.href;
        box.appendChild(a);
      });
      if (!box.children.length) box.innerHTML = '<div style="padding:14px 18px;font-size:.8rem;color:var(--text-muted)">这本书没有目录</div>';
    }).catch(function(){});
  }

  /* ---- 进度 ---- */
  var hideTimer, lastLoc = null, locReady = false;

  function showPct(v){
    if (isNaN(v)) return;
    pct.textContent = Math.round(v) + '%';
    meter.style.width = v + '%';
  }

  function updPct(loc){
    if (!loc || !loc.start) return;
    lastLoc = loc;
    var sp = book.spine.length;
    var idx = typeof loc.start.index === 'number' ? loc.start.index : 0;
    if (sp > 1) showPct(idx / (sp - 1) * 100);          // 粗估，立刻可用
    if (locReady && book.locations && book.locations.length()) {
      var p = book.locations.percentageFromCfi(loc.start.cfi);
      if (!isNaN(p)) showPct(Math.max(p * 100, 0.1));    // 精确值覆盖
    }
  }
  rendition.on('relocated', function(loc){
    if (!loc || !loc.start) return;
    try { localStorage.setItem(K('cfi'), loc.start.cfi); } catch (e) {}
    if (loc.start.href) {
      Array.prototype.forEach.call($('toclist').children, function(a){
        a.classList.toggle('on', a.dataset && a.dataset.href === loc.start.href);
      });
    }
    updPct(loc);
    if (barHidden) { pct.classList.remove('fade'); clearTimeout(hideTimer); hideTimer = setTimeout(function(){ pct.classList.add('fade'); }, 1600); }
  });

  /* ---- 手势（挂在 iframe 内部，父文档收不到 iframe 的触摸） ---- */
  rendition.on('rendered', function(section, view){
    var doc = view.document;
    if (!doc) return;
    paint();
    if (doc.__rdBound) return;
    doc.__rdBound = true;
    var sx = 0, sy = 0, moved = false;
    doc.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
    }, {passive:true});
    doc.addEventListener('touchmove', function(){ moved = true; }, {passive:true});
    doc.addEventListener('touchend', function(e){
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        dx < 0 ? rendition.next() : rendition.prev();
        return;
      }
      if (!moved) { doc.__tapTs = Date.now(); tapAt(t.clientX, doc); }
    }, {passive:true});
    doc.addEventListener('click', function(e){
      if (Date.now() - (doc.__tapTs || 0) < 600) return;   // 触摸产生的合成 click，忽略
      tapAt(e.clientX, doc);
    });
    doc.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); rendition.next(); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); rendition.prev(); }
    });
  });

  function tapAt(x, doc){
    var w = doc.documentElement.clientWidth || window.innerWidth;
    if (x < w * 0.24) rendition.prev();
    else if (x > w * 0.76) rendition.next();
    else toggleBar();
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); rendition.next(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); rendition.prev(); }
    if (e.key === 'Escape') { closeToc(); closePanel(); }
  });

  /* ---- 顶栏 / 抽屉 / 设置 ---- */
  function toggleBar(){
    barHidden = !barHidden;
    bar.classList.toggle('hide', barHidden);
    if (barHidden) {
      pct.classList.remove('fade');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){ pct.classList.add('fade'); }, 1600);
    } else {
      pct.classList.remove('fade');
    }
  }

  function openToc(){ $('toc').classList.add('on'); $('mask').classList.add('on'); closePanel(); }
  function closeToc(){ $('toc').classList.remove('on'); if (!$('panel').classList.contains('on')) $('mask').classList.remove('on'); }
  function openPanel(){ $('panel').classList.add('on'); $('mask').classList.add('on'); closeToc(); }
  function closePanel(){ $('panel').classList.remove('on'); if (!$('toc').classList.contains('on')) $('mask').classList.remove('on'); }

  $('btn-toc').onclick = openToc;
  $('btn-set').onclick = openPanel;
  $('mask').onclick = function(){ closeToc(); closePanel(); };

  $('seg-size').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    sz = b.dataset.sz;
    localStorage.setItem(K('sz'), sz);
    paint(); syncSegs();
  };
  $('seg-theme').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    html.setAttribute('data-theme', b.dataset.th);
    localStorage.setItem(K('ui'), b.dataset.th);
    paint(); syncSegs();
  };

  /* ---- 启动时隐藏顶栏，让正文占满 ---- */
  bar.classList.add('hide');
  barHidden = true;
  syncSegs();
})();
</script>
</body>
</html>
