<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>
:root,[data-theme="dark"]{
  --bg:#0a0c10;--text:#dfe5ec;--text-muted:#98a2b0;--border:#191d24;--accent:#6aa2d8;--rule:#232a33;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{--bg:#f3f5f8;--text:#1e2935;--text-muted:#526070;--border:#dfe4ea;--accent:#2d6496;--rule:#e3e8ee}
[data-theme="sepia"]{--bg:#f4ecd8;--text:#3b3327;--text-muted:#7a6e58;--border:#e0d4b8;--accent:#8a6a2f;--rule:#ddd0b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);line-height:1.85;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto}

#bar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(46px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);transition:transform .2s ease,opacity .2s ease}
#bar.hide{transform:translateY(-101%);opacity:0;pointer-events:none}
#title{flex:1;min-width:0;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center}
.btn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;border-radius:8px;color:var(--text-muted);cursor:pointer}
.btn:active{background:color-mix(in srgb,var(--text) 12%,transparent)}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

#doc{max-width:680px;margin:0 auto;padding:calc(62px + env(safe-area-inset-top)) 22px
  calc(40vh + env(safe-area-inset-bottom));
  font-size:var(--fs,17px)}
#doc section.ch{margin:0 0 3.2em}
#doc p{margin:0 0 1.05em;text-indent:2em}
#doc p:last-child{margin-bottom:0}
#doc h1,#doc h2,#doc h3{line-height:1.4;text-indent:0;margin:2.2em 0 1em;
  font-size:1.18em;font-weight:700;letter-spacing:-.01em;color:var(--text)}
#doc h1:first-child,#doc h2:first-child,#doc h3:first-child{margin-top:0}
#doc h4,#doc h5{font-size:1em;text-indent:0;margin:1.6em 0 .8em}
#doc blockquote{margin:1.4em 0;padding:0 0 0 1em;border-left:2px solid var(--rule);color:var(--text-muted)}
#doc hr{border:none;border-top:1px solid var(--rule);margin:2em 20%}
#doc img{display:block;margin:1.6em auto;border-radius:2px}
#doc table{width:100%;border-collapse:collapse;font-size:.92em}
#doc td,#doc th{border:1px solid var(--rule);padding:6px 8px}
#doc a{color:var(--accent)}
#doc .ch-sep{margin:2.6em auto;text-align:center;color:var(--text-muted);font-size:.8em;letter-spacing:.3em}

/* 右下角 120px 见方的热区：PC 上鼠标移进来才显示，触屏靠 .show 闪一下 */
#pct{position:fixed;right:0;bottom:0;width:120px;height:120px;z-index:30;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:0 12px calc(12px + env(safe-area-inset-bottom)) 0}
#pct span{font-family:var(--mono);font-size:.66rem;color:var(--text-muted);opacity:0;
  transition:opacity .25s}
#pct.show span{opacity:.55}
@media (hover:hover) and (pointer:fine){
  #pct{pointer-events:auto}
  #pct:hover span{opacity:.55}
}

#mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:45;opacity:0;pointer-events:none;
  transition:opacity .2s}
#mask.on{opacity:1;pointer-events:auto}
#toc{position:fixed;top:0;bottom:0;left:0;width:min(84vw,340px);z-index:50;background:var(--bg);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transform:translateX(-101%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
#toc.on{transform:none}
#toc h2{margin:0;padding:calc(15px + env(safe-area-inset-top)) 18px 11px;font-size:.68rem;
  font-family:var(--mono);letter-spacing:.06em;color:var(--text-muted);border-bottom:1px solid var(--border);
  font-weight:600}
#toclist{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:6px 0 calc(16px + env(safe-area-inset-bottom))}
#toclist a{display:block;padding:8px 18px;font-size:.85rem;line-height:1.5;color:var(--text);
  text-decoration:none;border-left:2px solid transparent}
#toclist a.on{color:var(--accent);border-left-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,transparent)}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:52;background:var(--bg);
  border-top:1px solid var(--border);border-radius:14px 14px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
#panel.on{transform:none}
.row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.row:last-child{margin-bottom:0}
.row>span{flex:none;width:44px;font-size:.74rem;color:var(--text-muted)}
.seg{flex:1;display:flex;gap:6px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--border);background:none;color:var(--text);
  border-radius:8px;font-size:.8rem;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}

#boot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:var(--bg);color:var(--text-muted);font-size:.82rem;
  transition:opacity .3s}
#boot.gone{opacity:0;pointer-events:none}
#boot b{color:var(--text);font-size:.95rem;font-weight:600}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (min-width:721px){#doc{padding-left:34px;padding-right:34px;--fs:18px}}
</style>
</head>
<body>
<header id="bar">
  <button class="btn" id="btn-toc" aria-label="目录">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div id="title">{{TITLE}}</div>
  <button class="btn" id="btn-set" aria-label="设置">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
  </button>
</header>

<div id="doc"></div>
{{CHAPTERS}}
<div id="pct"><span></span></div>

<div id="mask"></div>
<aside id="toc"><h2>目录</h2><div id="toclist"></div></aside>
<div id="panel">
  <div class="row"><span>字号</span><div class="seg" id="seg-size">
    <button data-sz="90">小</button><button data-sz="100">中</button><button data-sz="113">大</button></div></div>
  <div class="row"><span>底色</span><div class="seg" id="seg-theme">
    <button data-th="dark">深色</button><button data-th="light">浅色</button><button data-th="sepia">羊皮纸</button></div></div>
</div>

<div id="boot"><div class="spin"></div><div>载入中…</div></div>
<script>
(function () {
  var SLUG = {{SLUG}};
  var K = function (n) { return 'rd:' + SLUG + ':' + n; };
  var $ = function (id) { return document.getElementById(id); };
  var html = document.documentElement;
  var docEl = $('doc'), boot = $('boot'), bar = $('bar'), pct = $('pct'), pctTxt = pct.firstElementChild;
  /* 有鼠标就走 PC 交互：顶栏只认指针位置，进度只认悬停 */
  var pcMode = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var tocEl = $('toc'), tocList = $('toclist'), mask = $('mask'), panel = $('panel');

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';  // 位置由我们自己恢复
  var meta = null, sizes = [], total = 0, loaded = 0, busy = Promise.resolve();
  var curCh = 0, size = parseInt(localStorage.getItem(K('sz')) || '100', 10);
  var lastY = 0, saveTimer = null, ticking = false;

  /* ---------- 外观 ---------- */
  var theme = localStorage.getItem(K('ui')) ||
    ((window.matchMedia && window.matchMedia('(prefers-color-scheme:light)').matches) ? 'light' : 'dark');
  html.setAttribute('data-theme', theme);

  function applySize() {
    var base = window.innerWidth > 720 ? 18 : 17;
    docEl.style.setProperty('--fs', (base * size / 100).toFixed(1) + 'px');
    Array.prototype.forEach.call($('seg-size').children, function (b) {
      b.classList.toggle('on', +b.dataset.sz === size);
    });
  }
  function applyTheme() {
    Array.prototype.forEach.call($('seg-theme').children, function (b) {
      b.classList.toggle('on', b.dataset.th === theme);
    });
  }

  /* ---------- 载入 ---------- */
  function loadOne() {
    if (loaded >= meta.chapters.length) return Promise.resolve();
    var i = loaded;
    var t = document.getElementById('ch' + i);
    if (!t) { loaded++; return Promise.resolve(); }
    var sec = document.createElement('section');
    sec.className = 'ch';
    sec.id = 'sec' + i;
    sec.dataset.ch = i;
    sec.innerHTML = t.innerHTML;
    Array.prototype.forEach.call(sec.querySelectorAll('img'), function (im) {
      im.loading = 'lazy';
      im.decoding = 'async';
    });
    docEl.appendChild(sec);
    loaded++;
    return Promise.resolve();
  }

  /* 正文已内嵌在页面里，一次性挂载完。滚动是原生的，不走懒加载 —— 没有「滚到底却
     不续章」这类状态 bug，代价只是首屏多解析几百 KB。 */
  function ensure() {
    busy = busy.then(async function () {
      while (loaded < meta.chapters.length && loaded < 300) {
        await loadOne();
      }
    }).catch(function () {});
    return busy;
  }

  function chTop(i) {
    var s = $('sec' + i);
    return s ? s.getBoundingClientRect().top + window.scrollY : 0;
  }

  var tpls = Array.prototype.slice.call(document.querySelectorAll('template[id^="ch"]'));
  if (!tpls.length) {
    boot.innerHTML = '<div><b>这本书是空的</b></div>';
    return;
  }
  meta = {
    title: document.title,
    chapters: tpls.map(function (t) {
      return { t: t.dataset.t || '', n: parseInt(t.dataset.n || '0', 10), skip: t.dataset.skip === '1' };
    })
  };
  meta.chapters.forEach(function (c) { sizes.push(c.n || 0); total += (c.n || 0); });
  total = total || 1;
  $('title').textContent = meta.title;

  tocList.innerHTML = '';
  meta.chapters.forEach(function (c, i) {
    var a = document.createElement('a');
    a.href = 'javascript:void 0';
    a.textContent = c.t || ('第 ' + (i + 1) + ' 节');
    a.dataset.i = i;
    a.onclick = function () {
      closeToc();
      ensure(i).then(function () {
        window.scrollTo({ top: chTop(i) - 12, behavior: 'auto' });
      });
    };
    tocList.appendChild(a);
  });

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(K('pos')) || 'null'); } catch (e) {}
  var firstReal = 0;
  meta.chapters.forEach(function (c, i) { if (!firstReal && !c.skip) firstReal = i; });
  var start = saved && typeof saved.ch === 'number' ? Math.min(saved.ch, meta.chapters.length - 1) : firstReal;

  ensure(start).then(function () {
    boot.classList.add('gone');
    var rr = saved && typeof saved.r === 'number' ? saved.r : 0;
    if (start > 0 || rr > 0) {
      var el = $('sec' + start);
      var h = el ? el.offsetHeight : 0;
      window.scrollTo(0, chTop(start) + rr * Math.max(h - window.innerHeight, 0));
    }
    var first = tocList.children[start];
    if (first) first.classList.add('on');
    updateProgress();
  });

  applySize();
  applyTheme();

  /* ---------- 滚动：进度 / 预加载 / 顶栏 ---------- */
  /* 进度只在滚动停下后算一次：11 章每次都重新量一遍位置（一次 reflow），
     比每帧都量便宜得多，进度条也不需要 60fps。 */
  var progTimer = null;

  function updateProgress() {
    var secs = docEl.children;
    if (!secs.length) return;
    var probe = window.scrollY + Math.min(window.innerHeight * 0.4, 320);
    var ch = 0, r = 0;
    for (var i = 0; i < secs.length; i++) {
      var rc = secs[i].getBoundingClientRect();
      var top = rc.top + window.scrollY, h = rc.height;
      if (probe >= top && probe < top + h) { ch = i; r = (probe - top) / Math.max(h, 1); break; }
      ch = i; r = 1;
    }
    if (ch !== curCh) {
      curCh = ch;
      Array.prototype.forEach.call(tocList.children, function (a) {
        a.classList.toggle('on', +a.dataset.i === ch);
      });
    }
    var before = 0;
    for (var j = 0; j < ch; j++) before += sizes[j] || 0;
    var p = (before + (sizes[ch] || 0) * Math.min(r, 1)) / total * 100;
    if (!isNaN(p)) {
      pctTxt.textContent = Math.round(p) + '%';
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(K('pos'), JSON.stringify({ ch: ch, r: Math.min(r, 1) })); } catch (e) {}
    }, 400);
  }

  function updateProgressDebounced() {
    clearTimeout(progTimer);
    progTimer = setTimeout(updateProgress, 120);
  }

  function onScroll() {
    var y = window.scrollY;
    if (!pcMode) {   /* 触屏：上滑唤出、下滑收起；PC 走指针位置，见下面 */
      if (y > lastY + 8 && y > 90) bar.classList.add('hide');
      else if (y < lastY - 8) bar.classList.remove('hide');
    }
    lastY = y;
    if (!pcMode) flashPct();
    updateProgressDebounced();
  }

  /* PC：指针进到顶部 80px 以内才出现顶栏，离开 600ms 后收起 —— 阅读时整屏干净 */
  var barTimer = null;
  function hideBarSoon() {
    clearTimeout(barTimer);
    barTimer = setTimeout(function () {
      if (bar.matches(':hover')) return;
      bar.classList.add('hide');
    }, 600);
  }

  if (pcMode) bar.classList.add('hide');
  var mvSeen = 0, mvLast = null;
  window.addEventListener('mousemove', function (e) {
    /* 媒体查询在某些 WebView 里会把鼠标误判成触屏；连续几次真实位移才切 PC 模式，
       免得触屏的一次点击（合成 mousemove）把整页交互切成桌面版。 */
    if (!pcMode) {
      if (mvLast && (e.clientX !== mvLast[0] || e.clientY !== mvLast[1])) mvSeen++;
      mvLast = [e.clientX, e.clientY];
      if (mvSeen < 3) return;
      pcMode = true;
      bar.classList.add('hide');
    }
    if (e.clientY < 80) { clearTimeout(barTimer); bar.classList.remove('hide'); }
    else hideBarSoon();
  }, { passive: true });
  bar.addEventListener('mouseenter', function () { clearTimeout(barTimer); });
  bar.addEventListener('mouseleave', hideBarSoon);

  var pctTimer = null;
  function flashPct() {
    pct.classList.add('show');
    clearTimeout(pctTimer);
    pctTimer = setTimeout(function () { pct.classList.remove('show'); }, 1200);
  }

  function onScrollThrottled() {
    if (ticking) return;
    ticking = true;
    setTimeout(function () { ticking = false; onScroll(); }, 40);
  }
  window.addEventListener('scroll', onScrollThrottled, { passive: true });
  document.addEventListener('scroll', onScrollThrottled, { passive: true, capture: true });
  /* 有些内嵌 WebView（含本机的）根本不派发 scroll 事件，只有 scrollY 在变。轮询兜底。 */
  var pollY = window.scrollY;
  setInterval(function () {
    var y = window.scrollY;
    if (y === pollY) return;
    pollY = y;
    onScrollThrottled();
  }, 180);

  /* ---------- 交互 ---------- */
  function openToc() { tocEl.classList.add('on'); mask.classList.add('on'); closePanel(); }
  function closeToc() { tocEl.classList.remove('on'); if (!panel.classList.contains('on')) mask.classList.remove('on'); }
  function openPanel() { panel.classList.add('on'); mask.classList.add('on'); closeToc(); }
  function closePanel() { panel.classList.remove('on'); if (!tocEl.classList.contains('on')) mask.classList.remove('on'); }

  $('btn-toc').onclick = openToc;
  $('btn-set').onclick = openPanel;
  mask.onclick = function () { closeToc(); closePanel(); };

  $('seg-size').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var before = window.scrollY / Math.max(document.documentElement.scrollHeight, 1);
    size = +b.dataset.sz;
    localStorage.setItem(K('sz'), String(size));
    applySize();
    window.scrollTo(0, before * document.documentElement.scrollHeight);
    setTimeout(updateProgress, 80);
  };
  $('seg-theme').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    theme = b.dataset.th;
    html.setAttribute('data-theme', theme);
    localStorage.setItem(K('ui'), theme);
    applyTheme();
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeToc(); closePanel(); }
  });

  /* 跨章链接：#chN 由这里接管 */
  docEl.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    var h = a.getAttribute('href') || '';
    var m = /^#ch(\d+)$/.exec(h);
    if (m) {
      e.preventDefault();
      var i = +m[1];
      closeToc();
      ensure(i).then(function () { window.scrollTo({ top: chTop(i) - 12 }); });
    }
  });

  applySize();
  applyTheme();
})();
</script>
</body>
</html>
